<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>glyph-grid</title>
  <style>
    /* Black page, centered canvas. The visible canvas background is set
       per-frame from the active palette — this CSS is just the page chrome. */
    html, body {
      margin: 0; padding: 0;
      background: #000;
      color: #888;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      min-height: 100vh;
      /* Audit 2026-06-10 (live finding): wheel-scrolling the Tweakpane
         panel scrolled the whole document, pushing the canvas out of
         view while reaching the Export buttons at the bottom of the
         panel.  The document never needs to scroll — the canvas centers
         in the viewport and the panel scrolls internally (rule on
         .tp-dfwv below). */
      height: 100vh;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      padding: 16px;
      box-sizing: border-box;
    }
    canvas { display: block; }
    /* Audit 2026-06-10 (WCAG 2.4.7): guarantee a visible focus indicator
       on every interactive element — Tweakpane v3 ships no :focus-visible
       styling of its own, so keyboard navigation was invisible. */
    :focus-visible {
      outline: 2px solid #8fb5ff;
      outline-offset: 1px;
    }
    /* Tweakpane panel scrolls internally instead of the document. */
    .tp-dfwv {
      max-height: calc(100vh - 16px);
      overflow-y: auto;
    }
    /* Status bar (audit 2026-06-10, WCAG 1.4.3): solid chip instead of
       55%-opacity bare text.  The old style washed out to ~2.4:1 when the
       window was short enough for the bar to overlay the cream canvas.
       #d9d2c4 on rgba(10,10,10,.82) ≥ 9:1 on any backdrop. */
    #status {
      position: fixed;
      bottom: 10px; left: 12px;
      font-size: 11px;
      color: #d9d2c4;
      background: rgba(10, 10, 10, 0.82);
      padding: 3px 9px;
      border-radius: 5px;
      pointer-events: none;
      white-space: nowrap;
    }
    #status:empty { display: none; }
    /* Fallback @font-face is injected at runtime by glyph-fonts.js; the
       snippet below only kicks in if the loader fails before injection. */
  </style>
</head>
<body aria-label="glyph-grid render canvas">
  <div id="status" role="status" aria-live="polite"></div>

  <!-- p5.js core (unchanged from v1).  ITER-063: all four third-party libs are
       vendored, pinned and sha256-checked in vendor/ (see vendor/README.md) —
       the app and the headless CLI never touch the network to boot. -->
  <script src="vendor/p5-1.11.2/p5.min.js"></script>
  <!-- JSZip stays as the legacy-fallback recorder; new streaming recorder
       prefers File System Access API, then fflate. -->
  <script src="vendor/jszip-3.10.1/jszip.min.js"></script>
  <script src="vendor/fflate-0.8.2/index.js"></script>

  <!-- glyph-grid skill libs (v2). All IIFEs that attach to window.GlyphGrid. -->
  <script src="lib/glyph-compat.js"></script>
  <script src="lib/glyph-text-export.js"></script>
  <script src="lib/glyph-fonts.js"></script>
  <script src="lib/glyph-record.js"></script>
  <script src="lib/glyph-dither.js"></script>
  <script src="lib/glyph-shape-index.js"></script>
  <script src="lib/glyph-edge.js"></script>
  <script src="lib/glyph-xdog.js"></script>
  <script src="lib/glyph-palette-morph.js"></script>
  <script src="lib/glyph-timeline.js"></script>
  <script src="lib/glyph-crt.js"></script>
  <!-- Wave 1 runtime (load AFTER all primitive libs; order-sensitive). -->
  <script src="lib/glyph-runtime.js"></script>
  <script src="lib/glyph-primitives.js"></script>
  <!-- Wave 2 outputs. -->
  <script src="lib/glyph-outputs.js"></script>
  <!-- Wave 3 composition. -->
  <script src="lib/glyph-composition.js"></script>
  <!-- Wave 4 sources (feedback/audio/camera/video/data/canvas/RD/CA/flow). -->
  <script src="lib/glyph-sources.js"></script>
  <!-- Wave 5 sampling topologies. -->
  <script src="lib/glyph-sampling.js"></script>
  <!-- Polish: additional colors/selections/output + palettes. -->
  <script src="lib/glyph-polish.js"></script>
  <!-- Wave 6: postprocess.crt-chain, selection.harri-faithful,
       output.webgl-canvas + perf instrumentation, source.pointer/keyboard,
       output.audio-synth. -->
  <script src="lib/glyph-wave6.js"></script>
  <!-- v0.2 Phase 4 (F8): WebGL2 port of the studio source preprocess. -->
  <script src="lib/glyph-preprocess-gl.js"></script>
  <!-- Tweakpane v3 (UMD) — used by lib/glyph-studio.js when CONFIG.studio.enabled = true. -->
  <script src="vendor/tweakpane-3.1.10/tweakpane.min.js"></script>
  <script src="lib/glyph-studio.js"></script>

  <script>
  /* =================================================================
     glyph-grid v2 — single-file p5.js renderer.

     v2 adds eleven new pipeline stages behind CONFIG.compat:"v2". Every
     new stage has a gate (glyph-compat.gate*) that short-circuits if its
     own field is absent, so CONFIG.compat:"v2" with no other advanced
     fields is byte-identical to CONFIG.compat:"v1".

     Legacy contract preserved verbatim:
       - Two-layer composite: scene -> p5.Graphics (src) -> glyph grid.
       - Scene signature (g, t, config) => void.
       - `pixelDensity(1)` on both contexts.
       - Deterministic seeding via randomSeed + noiseSeed on both.
       - __glyphGridTest hook surface.

     New in v2 (all opt-in):
       - CONFIG.compat ("v1" | "v2") — single switch.
       - CONFIG.glyphSet — Unicode-16 sets (octant, sextant, braille, block).
       - CONFIG.selectionMode — brightness | shape | shape-edge-aware | edge-directional.
       - CONFIG.dither — ordered + error-diffusion dithers.
       - CONFIG.prefilter — XDoG edge styling prior to grid sampling.
       - CONFIG.postprocess — CRT, bloom, scanlines, chromatic aberration, etc.
       - CONFIG.retroMode — preset genre mode applied before user config.
       - CONFIG.renderer — "cpu" (default) | "gpu".
       - CONFIG.zones — scene-contract v2 zone-variable pipeline.
       - CONFIG.paletteMorph — OKLab interpolation across palettes over time.
       - CONFIG.timeline — keyframe tracks on any CONFIG path (lib/glyph-timeline.js).
       - CONFIG.recording — streaming output via File System Access API.
     ================================================================= */

  /* =================================================================
     CONFIG — defaults preserve v1 behavior. New v2 fields default to
     inactive (all gates return false).
     ITER-075: `let`, not `const` — while a timeline is active draw() points
     CONFIG at a per-frame shadow (see draw()) and back at CONFIG_BASE, the
     object Tweakpane, presets and every setter hold.
     ================================================================= */
  let CONFIG = {
    /* --- v2 gate (single switch) --- */
    compat: 'v2',

    /* Sutskever Stage 1 — render substrate. 'cpu' (default, the proven
       canvas-2D sprite path) | 'webgl' (instanced-quad GPU path, opt-in,
       gated to the monochrome/no-postproc signature path in v1, auto
       CPU-fallback on GL failure). Stage 2 lifts the postproc gate. */
    renderer: 'cpu',

    /* --- v1 fields ---
       Canvas matches the reference photo's 1356x668 (≈2.03:1).  Grid
       220x55 ≈ 12,100 cells (cell ~5.8 × 11.5, mono-char aspect).
       Denser than the 200x50 reference grid but readable at 11px. */
    /* Microscopic-detail config — 240×120 octant grid + shape-edge-aware
       selection + ROI on the hand-and-chip area.  Effective resolution
       inside the ROI is 720×360 sub-cells via 2×4-octant encoding.
       Font family forces the bundled WOFF2 stack directly so octant
       codepoints render via unicode-range matching from frame 1
       (sidesteps the fontDescriptor-null window). */
    canvas: { w: 1024, h: 504 },
    grid: {
      /* Back to 240×120 base — the variant before the 320×160 bump.
         Cells ~4.27×4.20 px.  No ROIs (their re-sampling killed the
         per-frame breathing). Extra chip-area detail comes from a
         third sharpen pass in the preprocess focused on the chip
         rectangle, not from a higher-density grid — so no visible
         ROI boundary box. */
      cols: 240, rows: 120,
    },
    font: {
      /* size 8 paired with 4.27-px cells: chars overlap horizontally
         (94% coverage) and bleed into neighbours, dissolving column
         stripes. Inside the chip ROI the font scales down 1/bump=8/3
         ≈ 2.7px so chars fit the finer 1.42-px ROI cells. */
      family: 'monospace',
      size: 8,
    },
    /* gradient — leading spaces (rampLast cells with curved < threshold
       get the space char and skip drawing).  Required for the cream-
       paper look: bright source = paper bg shows, dark source = dense
       glyphs render.  Without leading spaces every cell drew a mark
       and the cream bg got a visible column-stripe pattern. */
    ramp: 'gradient',
    /* gamma 0.55: bright source cells reach the deep-charcoal stop
       at the top of the palette, giving high-contrast figure stipple.
       The cream-paper-bg cleanliness is handled by the hard signal
       threshold (_bgFloor) in the EMA hook, not by gamma. */
    brightnessGamma: 0.55,
    /* bgThreshold (0..1, default 0 = disabled).  When > 0, any cell whose
       source luminance is above this value is forced to signal=0 (rendered
       as palette bg / cream paper).  Lets the cream-paper sketch aesthetic
       work on bright-bg sources (white anime panels, photos with white
       backgrounds) by punching out the bright bg before it gets rendered
       as dense ink.  Set to ~0.65–0.85 for white-bg sources; leave at 0
       for the original kaneki workflow where the source is mostly dark. */
    bgThreshold: 0,
    /* invertSignal — flips bright↔dark for the brightness signal.  Default
       is bright source → ink, dark source → cream (works when source is
       mostly dark with bright accents, like the original kaneki).  When
       the source is mostly bright with dark details (white-bg portraits,
       anime panels with light hair on light bg), invertSignal: true makes
       the DARK details become the drawn ink and the bright areas become
       cream paper — giving the same selective-sketch aesthetic on
       inverted-luminance sources. */
    invertSignal: false,
    samplingStrategy: 'average',
    /* monochrome — single dark ink with alpha driven by cell signal.
       Bright cells = opaque dark char (stipple), dim cells = low
       alpha → cream paper bg shows through. Cleaner silhouette feel
       than gradient mode + multi-stop palette which produced mid-
       tone tan washes. */
    colorMode: 'monochrome',
    palette: 'cream-paper',
    scene: 'studio',
    animation: { fps: 30, duration: 6.0, loop: true },
    seed: 1337,
    record: false,

    /* --- v2 pipeline: high-density brightness mapping with gradient
       ramp.  Shape-edge-aware over octants gave gorgeous results but
       the per-cell text() rasterisation of octant codepoints hit ~5s
       on 20K cells.  With 320×160 ASCII cells the grid pattern is
       already sub-pixel from normal viewing distance, so brightness
       suffices and renders ~10× faster. */
    glyphSet: null,
    selectionMode: 'brightness',

    /* Temporal dither — Bayer8 quantization with a per-frame pixel
       offset hashed by (seed, frameIdx).  Each cell's glyph index
       shifts slightly between frames, animating the pixel grid: cells
       on quantization boundaries roll between adjacent ramp chars
       every frame. This is the "animated pixels" effect. */
    dither: { mode: 'temporal', asSourcePrefilter: true },

    /* XDoG OFF for cream-paper look — XDoG outputs near-1.0
       everywhere except edges, which makes 90% of cells "bright"
       and stipples the whole image including bg.  Direct linear
       luminance gives the correct light-figure-on-cream-paper
       mapping for this photograph.  Breathing now comes from EMA
       + temporal dither alone. */
    prefilter: { mode: 'none' },

    /* Postprocess: vignette + bloom + halation give the auric glow halo
       around the bright silver chip pixels.  depthFog tints the far
       cells (face area) toward a cool dim charcoal so the face reads
       as further away from the camera than the hand+chip. */
    /* Postprocess defaults — vignette stays on (it's cheap, ~5ms, and
       reads as a "frame" around the canvas).  bloom + halation OFF by
       default — they cost ~80–180ms each (full-canvas box-blur) and
       were carry-overs from the original showcase config, not appropriate
       for a generic studio default.  Users who want them can toggle in
       the Postprocess folder.  See PERF-BASELINE.md for the data behind
       this choice. */
    postprocess: {
      vignette: { enabled: true,  strength: 0.55 },
      bloom:    { enabled: false, radius: 2.5, strength: 0.95 },
      halation: { enabled: false, strength: 0.70 },
      depthFog: { enabled: false },
    },

    /* Depth disabled — the radial near-zone in the depth map drew
       a dark fog ring around its center, which landed on the man's
       head and read as a "hole in the head" artifact.  Removing depth
       gives back the clean charcoal-breathing look. */
    depth: { enabled: false },

    paletteMorph: null,
    /* ITER-075 (R2): keyframe tracks keyed by dotted CONFIG path, evaluated
       per frame into a shadow config.  tracks: { '<path>': [{u, v, ease}] },
       u in [0,1] of animation.duration; ease linear | inOutSine | step. */
    timeline: { enabled: false, tracks: {} },
    /* v0.1.6: anti-flicker Schmitt trigger on ramp index (off = legacy). */
    temporalStability: { enabled: false, strength: 0.75 },
    /* v0.1.6: ETF flow mode tuning (selectionMode: 'flow'). */
    flow: { coherence: 0.30, energy: 0.06, smoothing: 2 },
    recording: { mode: 'legacy' },

    /* Dispersal — stardust effect.  Each inked cell drifts in a seeded
       random direction (upward-biased) and fades out as time crosses
       startT → endT (fractions of animation.duration).  Cream-paper bg
       is naturally exempt since space-glyph cells already render nothing.
       Designed for one-shot end-of-animation effects ("dimming →
       stardust → blank paper"); for looping renders the effect resets
       at frame 0 of each loop, which can read as breathing-out. */
    dispersal: {
      enabled:     false,
      startT:      0.5,    // 0..1 fraction of duration when drift begins
      endT:        0.95,   // 0..1 fraction of duration when fully dispersed
      intensity:   0.4,    // max drift distance as fraction of canvas height
      upwardBias:  0.7,    // 0 = random direction, 1 = pure upward
      swayAmount:  0.5,    // horizontal sine wobble for organic feel (px scale)
      rippleAmt:   0.2,    // per-cell start-time jitter; 0 = all-at-once, 0.3 = 30% ripple
    },

    /* Studio UI (Tweakpane). Setting enabled:true builds a control
       panel that live-tunes everything in CONFIG. Breathing constants
       are read by the EMA hook in drawGlyphGridV2. */
    studio: {
      enabled: true,
      /* Auto-resize canvas to match the source image's aspect ratio when
         a new image loads. Caps long edge at MAX_CANVAS_LONG (1024) to
         keep render cost predictable. Set false to keep canvas at the
         CONFIG.canvas dimensions regardless of source aspect. */
      fitCanvasToImage: true,
      /* v0.2 Phase 4 (F8): run the per-frame source preprocess of ANIMATED
         sources as three WebGL2 fragment passes (lib/glyph-preprocess-gl.js)
         instead of ~10 JS loops. Stills keep the JS path (it runs once and
         is cached). Falls back to JS when WebGL2 is unavailable. */
      gpuPreprocess: true,
      breathing: {
        emaAlpha:  0.35,
        gainSwing: 0.30,
        jitter:    0.05,
        pulseHz:   0.7,
      },
    },
  };
  const CONFIG_BASE = CONFIG;

  /* =================================================================
     RAMPS — v1 legacy density strings. v2's glyphSet supersedes this
     when set.
     ================================================================= */
  const RAMPS = {
    classic: ' .\u00b7:-=+*#%@',
    dense: ' .,:;i1tfLCG08@',
    sparse: ' .:+#@',
    'unicode-block': ' \u2591\u2592\u2593\u2588',
    /* v2.1 — denser near-monotonic ramp for smooth tonal gradients
       (pairs with colorMode:"gradient") */
    gradient: '  .,:;-~+=<>*oOwmM8B#%@',
    /* No-space monotonic ramp — every cell gets a glyph. */
    gradientNoSpace: '.,:;-~+=<>*oOwmM8B#%@',
    /* No-space shaded-block ramp — every cell fills uniformly with
       a block-element character, leaving no stroke alignment for the
       grid pattern to read against.  4 brightness bands carry shading
       through duotone color lerp. */
    blockShaded: '░▒▓█',
    /* 8-step block ramp — vertical block ascender from empty to full,
       chars touch top-to-bottom across rows so cell baselines vanish. */
    blockAscend: '▁▂▃▄▅▆▇█',
    /* v2.1 — glyphs biased toward radial / diagonal strokes for
       radially-symmetric features like sandworm maw filaments */
    radial: ' .*+xX%vY',
  };

  /* =================================================================
     PALETTES — unchanged v1 set.
     ================================================================= */
  const PALETTES = {
    monochrome:    { bg: '#000000', inks: ['#FFFFFF'] },
    phosphor:      { bg: '#001100', inks: ['#33FF66', '#88FFAA'] },
    bauhaus:       { bg: '#F2EBDA', inks: ['#D62828', '#1D3557', '#F4C430'] },
    lovespark:     { bg: '#000000', inks: ['#FFB7C5', '#E91E8C', '#7FFFD4'] },
    'mono-amber':  { bg: '#1A0D00', inks: ['#FFB000'] },
    /* Mr-Robot / hacker-terminal cyan — four stops for gradient mode. */
    'cyber-phosphor': { bg: '#020609', inks: ['#EAFBFF', '#7FE9FF', '#39A4BC', '#143240'] },
    /* Amber CRT phosphor — vintage-terminal warm light. */
    'amber-phosphor': { bg: '#0A0500', inks: ['#FFEDB8', '#FFB000', '#B85E00', '#3A1A00'] },
    /* Bone-on-charcoal — hand-drawn study feel. */
    'bone-charcoal':  { bg: '#0A0907', inks: ['#F5ECDA', '#C8B89E', '#7A6B58', '#2A241D'] },
    /* Cream-paper — single deep-charcoal ink on cream paper bg.
       Used with colorMode: 'monochrome' so each char's alpha is
       driven by cell signal: dim cells → low alpha → cream shows,
       bright cells → high alpha → opaque dark stipple. */
    'cream-paper': {
      bg: '#E8DDC8',
      inks: ['#0E0805'],
    },
    /* Silver-charcoal — gradient mode interpAtU maps u=1 → stops[n-1],
       so the brightest stop must be LAST.  Order: dim charcoal → mid
       charcoal → ash → bone → silver. Chip+tweezers polygon gets
       painted bright in the scene → cells there read curved≈1 → land
       on the silver stop. */
    'silver-charcoal': {
      bg: '#0A0907',
      inks: ['#2A241D', '#7A6B58', '#C8B89E', '#F5ECDA', '#E8F2FA'],
    },
    /* Spice — Arrakis melange, ported from the paul-arrakis-spice
       piece.  inks[0] amber + inks[1] rust drive duotone lerp; inks[2]
       pale-gold + inks[3] deep-ember are used by atmospheric layers. */
    'spice':         { bg: '#0A0302', inks: ['#FFB347', '#E85D1A', '#FFE4A8', '#9C4A16'] },
    /* Kawaii-pink — soft cream→blush→hot-pink→magenta gradient. Pairs
       with the kawaii postprocess overlay (hearts + sparkles). All inks
       are perceptually-uniform-ish in OKLab so gradient colorMode reads
       as a smooth pink wash. inks[0] is the pale highlight, inks[3] the
       deepest plum. */
    'kawaii-pink':   { bg: '#FFF0F5', inks: ['#FFE4F0', '#FFB7DC', '#FF6FB8', '#C73E8E', '#7A1F4D'] },
  };

  function inkColor(config, i) {
    const inks = PALETTES[config.palette].inks;
    return inks[i % inks.length];
  }
  function bgColor(config) { return PALETTES[config.palette].bg; }

  /* =================================================================
     ASSETS
     ================================================================= */
  let sourceImg = null;       /* source image — fed by drag-drop / Pick image */
  let sparkyImg = null;       /* optional mascot used by the sparkyPortrait scene */

  /* Source-presence hook for the studio panel (a separate module).  Without
     this, clicking Export GIF/MP4 on the empty canvas starts a recording
     whose frames are never captured — draw() early-returns in the empty
     state (see the "Drop an image to start" branch), so the recorder spins
     forever and the app appears frozen.  BUG-010 (v0.1.8). */
  window.__glyphHasSource = function () { return !!(sourceImg && sourceImg.width); };
  function preload() {
    /* No bundled source image — the studio launches blank with a
       "Drop an image to start" placeholder. The user supplies one via
       drag-drop or the Pick image… button in the panel. */
  }

  /* =================================================================
     SCENES (v1 set preserved).
     ================================================================= */
  /* Pass 2B — XDoG sigma sweep. Mutates CONFIG.prefilter.sigma so
     the DoG kernel breathes across the loop. The skill's xdog
     reads CONFIG.prefilter.sigma per draw; we just have to set it
     here. Range stays in [0.65, 1.05] per references/xdog.md.
     Hoisted out of the studio scene so draw() can still run it on
     frames where the memoized source layer skips the scene. */
  function studioSigmaSweep(t, config) {
    if (config.prefilter && config.prefilter.mode === 'xdog') {
      const loopPhase = (t / config.animation.duration) * Math.PI * 2;
      const sigmaBase = 0.85, sigmaSwing = 0.20;
      config.prefilter.sigma = sigmaBase + sigmaSwing * Math.sin(loopPhase);
    }
  }

  const SCENES = {
    caduceusHelix(g, t, config) {
      const W = g.width, H = g.height;
      g.background(bgColor(config));
      g.noFill();
      const cx = W / 2;
      const top = H * 0.08;
      const bot = H * 0.92;
      const amplitude = W * 0.18;
      const turns = 5.5;
      const speed = (Math.PI * 2) / config.animation.duration;
      const samples = 320;
      g.stroke(inkColor(config, 0));
      g.strokeWeight(2.5);
      g.line(cx, top, cx, bot);
      for (let helix = 0; helix < 2; helix++) {
        g.stroke(inkColor(config, 1 + helix));
        g.strokeWeight(2);
        const phase = helix * Math.PI;
        g.beginShape();
        for (let i = 0; i <= samples; i++) {
          const u = i / samples;
          const y = top + u * (bot - top);
          const angle = u * turns * Math.PI * 2 + phase + t * speed;
          const x = cx + Math.cos(angle) * amplitude;
          g.vertex(x, y);
        }
        g.endShape();
      }
      const bandTop = top + (bot - top) * 0.18;
      const bandBot = top + (bot - top) * 0.32;
      const bandLeft = cx - amplitude * 1.6;
      const bandRight = cx + amplitude * 1.6;
      const dashes = 180;
      g.strokeWeight(1);
      for (let i = 0; i < dashes; i++) {
        const fx = bandLeft + (bandRight - bandLeft) * (i / dashes);
        const fy = bandTop + (bandBot - bandTop) * g.noise(i * 0.13, t * 0.5);
        const a = g.noise(i * 0.07, t * 0.3 + 100) * 255;
        const c = g.color(inkColor(config, 0));
        c.setAlpha(a);
        g.stroke(c);
        g.line(fx, fy, fx + 2.5, fy);
      }
    },

    flowField(g, t, config) {
      const W = g.width, H = g.height;
      g.background(bgColor(config));
      g.noFill();
      g.strokeWeight(1.2);
      const lines = 220;
      const stepsPerLine = 60;
      const stepSize = 6;
      const noiseScale = 0.0035;
      const tDrift = t * 0.15;
      for (let i = 0; i < lines; i++) {
        const sx = ((i * 73) % 13) / 13 * W * 0.07 + (i / lines) * W;
        const sy = ((i * 31) % 11) / 11 * H * 0.07 + ((i * 17) % lines) / lines * H;
        let x = sx % W;
        let y = sy % H;
        g.stroke(inkColor(config, i % 3));
        g.beginShape();
        for (let s = 0; s < stepsPerLine; s++) {
          if (x < 0 || x > W || y < 0 || y > H) break;
          g.vertex(x, y);
          const angle = g.noise(x * noiseScale, y * noiseScale, tDrift) * Math.PI * 4;
          x += Math.cos(angle) * stepSize;
          y += Math.sin(angle) * stepSize;
        }
        g.endShape();
      }
    },

    sparkyPortrait(g, t, config) {
      const W = g.width, H = g.height;
      g.background(bgColor(config));
      const speed = (Math.PI * 2) / config.animation.duration;
      const loopPhase = t * speed;
      const sparkleCount = 60;
      g.strokeCap(g.ROUND ?? 'round');
      for (let i = 0; i < sparkleCount; i++) {
        const seed = i * 97 + 13;
        const baseX = ((seed * 53) % 1000) / 1000 * W;
        const baseY = ((seed * 31) % 1000) / 1000 * H;
        const drift = (baseY - (t / config.animation.duration) * H) % H;
        const y = drift < 0 ? drift + H : drift;
        const twinkle = (Math.sin(loopPhase * 3 + i * 0.7) + 1) / 2;
        const size = 3 + twinkle * 9;
        const c = g.color(inkColor(config, 2));
        c.setAlpha(60 + twinkle * 195);
        g.stroke(c);
        g.strokeWeight(1.4);

    if (GlyphGrid.compat.gateSalientROIs(CONFIG)) {

  /* v2.1 — per-ROI finer-grid overdraw.  Each roi is { x, y, w, h, bump }

     density inside that rect.  ROI contents are cleared to bg first
     so the finer pass lands cleanly on top of the coarse draw. */
  function drawSalientROIs(g, rois) {
    const palette = PALETTES[CONFIG.palette];
    const bgC = color(palette.bg);
    const bgR = red(bgC), bgG = green(bgC), bgB = blue(bgC);
    const ramp = RAMPS[CONFIG.ramp];

    const baseRows = CONFIG.grid.rows;

      const ry0 = Math.floor((roi.y || 0) * srcH);

      const rh = Math.floor((roi.h || 0) * srcH);
      if (rw < 2 || rh < 2) continue;
      const roiCols = Math.max(1, Math.round(rw / origCellW * bump));
      const roiRows = Math.max(1, Math.round(rh / origCellH * bump));
      const roiCellW = rw / roiCols;
      const roiCellH = rh / roiRows;

      const cellPxH = Math.max(1, Math.floor(roiCellH));

      textSize(prevFontSize / bump);

          const y0 = ry0 + Math.floor(r * roiCellH);
          const cx = x0 + roiCellW / 2;
          const cy = y0 + roiCellH / 2;

          const dr = sample.r - bgR;
          const dg = sample.g - bgG;
          const db = sample.b - bgB;

     28,800 × ~4.5μs (fillText) ≈ 130ms to 28,800 × ~0.5μs (drawImage)

         ...
         row k-1 = glyphs at tint(1.0)           y=(k-1)*tileH..k*tileH

      parseInt(full.slice(2, 4), 16),

  let _rampDuotoneSprite = null, _rampDuotoneKey = null, _rampDuotoneSpaceMask = null;

  /* --- Gradient atlases (ramp + glyph variants) --- */

  let _rampGradientSprite = null, _rampGradientKey = null, _rampGradientSpaceMask = null;

     Same expected speedup as the shape-mode sprite atlas (~8× faster

    if (_rampSpriteKey === key && _rampSprite) return _rampSprite;

  let _glOk = true;

     The 38ms postproc-stage regression we saw in shape-edge-aware mode came
     from the readback, not from the per-pixel work — so skipping the readback
     is the actual fix. */

  /* Vignette as a canvas2D 'multiply' overlay.  Pre-builds a w×h canvas where
     each pixel encodes the `1 - s·r²` darken factor (radial falloff matching
     applyVignette in glyph-crt.js byte-for-byte).  Cached by (w, h, strength);
     rebuilt only when any of those changes — i.e. on canvas resize or
     strength slider adjustment. */
  let _vignetteOverlay = null;       // { canvas, key }
  /* Unit-strength mask, keyed on size only (for strength ≤ 1).  Strength is applied at draw
     time via globalAlpha: multiply at alpha s gives c·(1 − s·r²), the old
     per-strength mask up to ±2 LSB — so dragging the strength slider no
     longer rebuilds a full-canvas overlay per tick (ITER-043).  globalAlpha
     caps at 1, so strengths above 1 (slider max 1.5) keep a baked mask. */
  function _ensureVignetteOverlay(w, h, maskStrength) {
    const key = w + 'x' + h + ':' + maskStrength;
    if (_vignetteOverlay && _vignetteOverlay.key === key) return _vignetteOverlay;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(w, h);
    const d = imgData.data;
    const cx = w * 0.5, cy = h * 0.5;
    const maxR = Math.hypot(cx, cy);
    for (let y = 0; y < h; y++) {
      const dy = y - cy;
      const dy2 = dy * dy;
      for (let x = 0; x < w; x++) {
        const dx = x - cx;
        const r = Math.sqrt(dx * dx + dy2) / maxR;
        const v = ((1 - maskStrength * r * r) * 255) | 0;
        const i = (y * w + x) * 4;
        d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 255;
      }
    }
    ctx.putImageData(imgData, 0, 0);
    _vignetteOverlay = { canvas: canvas, key: key };
    return _vignetteOverlay;
  }

  // HOT-PATH: _hasImgDataStages — gate function for the postprocess
  // pixel-readback round-trip. Optimization loop may inline-rewrite this.
  //
  // F4 (audit OPT-003): a stage is only "active" if its intensity-bearing
  // field is > epsilon. enabled:true with strength:0 is a no-op that should
  // NOT trigger the full getImageData + putImageData round-trip (~5 ms/frame
  // combined on default canvas). Mirrors the _stageActive helper in
  // glyph-compat.js — same source of truth as gatePostprocess.
  function _hasImgDataStages(p, skipOverlayable) {
    if (!p) return false;
    function _on(s, ks) {
      if (!s || !s.enabled) return false;
      for (let i = 0; i < ks.length; i++) {
        const v = s[ks[i]];
        if (typeof v === 'number' && v > 0.001) return true;
      }
      return false;
    }
    return _on(p.phosphorDecay, ['decay']) ||
           _on(p.crtBeam, ['intensity']) ||
           _on(p.halation, ['intensity', 'strength']) ||
           _on(p.bloom, ['intensity', 'strength']) ||
           _on(p.godRays, ['strength', 'intensity']) ||
           (!skipOverlayable && _on(p.scanlines, ['intensity', 'strength'])) ||
           _on(p.chromaticAberration, ['amount']) ||
           _on(p.barrel, ['amount']) ||
           (!skipOverlayable && _on(p.kawaii, ['intensity']));
  }

  /* v0.2 Phase 4 (F10 Tier A): scanlines and kawaii are drawn as canvas-2D
     composites when they are the ONLY imgData stages, so such stacks skip
     the full-canvas getImageData/putImageData. True when a stage that still
     needs the RGBA readback is active. `_hasImgDataStages` keeps its meaning
     (any per-pixel CRT stage — the idle detector uses it: kawaii twinkles). */
  function _needsImgDataReadback(p) {
    if (!p || !_hasImgDataStages(p)) return false;
    const sl = p.scanlines;
    const slOn = !!(sl && sl.enabled);
    const slI = slOn ? (sl.intensity == null ? 0.25 : sl.intensity) : 0;
    if (slOn && !(slI >= 0)) return true;  /* negative/NaN intensity brightens — CPU only */
    return _hasImgDataStages(p, true);
  }

  /* Scanline darken mask: opaque black on the rows applyScanlines darkens,
     transparent elsewhere; drawn source-over at globalAlpha = intensity it
     gives c·(1 − intensity) on those rows (±1 LSB vs the RGBA multiply).
     Cached by (w, h, period, phase). */

    const key = w + 'x' + h + ':' + period + ':' + phase;
    if (_scanlineOverlay && _scanlineOverlay.key === key) return _scanlineOverlay;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#000';
    for (let y = 0; y < h; y++) {
      if ((y + phase) % period === 0) continue;   /* same row test as applyScanlines */
      ctx.fillRect(0, y, w, 1);
    }
    _scanlineOverlay = { canvas: canvas, key: key };
    return _scanlineOverlay;
  }

  // HOT-PATH: applyPostprocess — pixel-stage round-trip. Optimization loop
  // tracks no per-frame allocations + may rewrite the gate logic.
  function applyPostprocess() {
    const ctx = drawingContext;
    const w = width, h = height;
    const post = CONFIG.postprocess || {};
    const frameIdx = (recState && typeof recState.frameIdx === 'number')
      ? recState.frameIdx
      : (frameCount - 1);
    const reduced = __prefersReducedMotion();

    /* Phase A — only when an imgData stage that needs the RGBA buffer is
       active (applyChain then also runs scanlines/kawaii in-buffer). */
    if (_needsImgDataReadback(post)) {
      const imgData = ctx.getImageData(0, 0, w, h);
      /* Stateful stages need a host-owned state: applyChain's own lazy
         init only rebinds its local, so a null crtState meant a fresh
         8 MB buffer per frame and phosphor/beam that never advanced. */
      const pd = post.phosphorDecay, cb = post.crtBeam;
      if (((pd && pd.enabled) || (cb && cb.enabled))
          && (!crtState || crtState.width !== imgData.width
              || crtState.height !== imgData.height)) {
        crtState = GlyphGrid.crt.makeState(imgData.width, imgData.height);
      }
      GlyphGrid.crt.applyChain(imgData, crtState, post, {
        prefersReducedMotion: reduced,
        frameIdx: frameIdx,
        skipOverlays: true,            /* vignette + letterbox handled below */
      });
      ctx.putImageData(imgData, 0, 0);
    } else if (_hasImgDataStages(post)) {
      /* Tier A — scanlines then kawaii, the order applyChain uses, both
         before the vignette/letterbox overlays like the Phase A path. */
      const prevAlpha = ctx.globalAlpha, prevFill = ctx.fillStyle;
      const prevOp = ctx.globalCompositeOperation;
      ctx.globalCompositeOperation = 'source-over';
      const sl = post.scanlines;
      if (sl && sl.enabled) {
        const intensity = sl.intensity == null ? 0.25 : sl.intensity;
        if (intensity > 0) {
          const period = Math.max(1, sl.period | 0 || 2);
          const phase = reduced ? 0 : (sl.phase || 0);
          ctx.globalAlpha = intensity > 1 ? 1 : intensity;
          ctx.drawImage(_ensureScanlineOverlay(w, h, period, phase).canvas, 0, 0);
        }
      }
      const kw = post.kawaii;
      if (kw && kw.enabled) GlyphGrid.crt.applyKawaiiCtx(ctx, w, h, kw, frameIdx);
      ctx.globalAlpha = prevAlpha; ctx.fillStyle = prevFill;
      ctx.globalCompositeOperation = prevOp;
    }

    /* Phase B — overlays. drawImage with composite op; no readback. */
    if (post.vignette && post.vignette.enabled) {
      const strength = typeof post.vignette.strength === 'number' ? post.vignette.strength : 0.5;
      if (strength > 0.001) {
        /* Exports bake the exact per-strength mask (byte-identical to the
           pre-ITER-043 output); live preview uses the size-keyed unit mask
           scaled by globalAlpha so slider drags don't rebuild it. */
        const baked = !!recState || strength > 1;
        const overlay = _ensureVignetteOverlay(w, h, baked ? strength : 1);
        const prevOp = ctx.globalCompositeOperation;
        const prevAlpha = ctx.globalAlpha;
        ctx.globalCompositeOperation = 'multiply';
        ctx.globalAlpha = baked ? 1 : strength;
        ctx.drawImage(overlay.canvas, 0, 0);
        ctx.globalAlpha = prevAlpha;
        ctx.globalCompositeOperation = prevOp;
      }
    }
    if (post.letterbox && post.letterbox.enabled) {
      const ratio = typeof post.letterbox.ratio === 'number' ? post.letterbox.ratio : 0;
      if (ratio > 0.001) {
        const barH = (h * ratio) | 0;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, barH);
        ctx.fillRect(0, h - barH, w, barH);
      }
    }
  }

  /* =================================================================
     Recording
     ================================================================= */
  /* Phase 1 — GIF export freeze fix.

     Previously: canvas.toDataURL('image/png') ran SYNCHRONOUSLY on the
     main thread once per recorded frame. At 100-300ms per call × 24-48
     frames, the UI froze for 2.4-15 seconds during recording.

     Now: canvas.toBlob() encodes asynchronously. Main thread stays free
     between captures so the canvas keeps animating + the UI stays
     responsive. State machine handles "previous capture still in flight"
     by skipping that frame's record (the next p5 draw cycle re-fires).

     Subtle correctness note: the recorded frame may not be byte-equal
     to what's on screen at the exact moment handleRecordFrame fires
     because toBlob captures the canvas AT THE TIME of the encode (after
     the queued microtasks settle). For a 24-frame loop this is
     imperceptible — frames are still in temporal order. */
  let __recordJobSequence = 0;

     through a bounded window, so decode memory no longer grows with frames;
     Rust bounds what it retains (256 MB of PNG, 1 GiB of raw RGBA) and
     guards single frames. Only the frame count is checked here. */

  function validateCaptureBudget(requestedTotal, captureWidth, captureHeight) {
    const total = Math.max(1, Math.round(Number(requestedTotal) || 1));
    const pixels = Math.max(0, Number(captureWidth) || 0)
      * Math.max(0, Number(captureHeight) || 0) * total;
    let code = null;
    let message = '';
    if (total > MAX_CAPTURE_FRAMES) {
      code = 'capture-frame-limit';
      message = 'Export frame limit exceeded (' + total + ' > ' + MAX_CAPTURE_FRAMES + ')';

      const reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result).split(',')[1] || ''); };
      reader.onerror = function () { reject(reader.error || new Error('FileReader failed')); };

    state._zipPromise = Promise.resolve().then(function () {
      if (state.zip) return state.zip.generateAsync({ type: 'blob' });
      if (!state.framesB64 || !state.framesB64.length) {
        throw new Error('Fallback ZIP unavailable: recording did not retain frames');
      }
      const zip = new JSZip();
      for (let i = 0; i < state.framesB64.length; i++) {
        const name = `frame_${String(i + 1).padStart(4, '0')}.png`;
        zip.file(name, state.framesB64[i], { base64: true });

    });

      total: state.total,
      framesB64: state.framesB64,
      getFrames: function () { return state.framesB64 || []; },
      getFallbackZip: function () { return lazyFallbackZip(state); },

    window.__statusHold = true;
    statusEl().textContent = 'Recording stopped: ' + (error && error.message ? error.message : String(error));
    window.__statusHoldTimer = setTimeout(() => { window.__statusHold = false; }, 5000);

  /* ITER-041: capture is pipelined. toBlob snapshots the canvas bitmap
     when it is called (HTML spec; the PNG encode itself is async), so the
     next logical frame may draw while frame N encodes/streams. Up to
     CAPTURE_PIPELINE_DEPTH frames are in flight; at the cap the draw loop
     pauses (noLoop) and resumes as the oldest frame settles. Consumers

     see frames strictly in index order. */

    if (state.frameIdx >= state.total) return; // all captured; chain draining

    const name = `frame_${String(idx + 1).padStart(4, '0')}.png`;
    statusEl().textContent =

    /* ITER-052 (F2 step 2): raw capture reads the canvas back with
       getImageData, synchronously and before the next draw, and hands the
       onFrame consumer straight RGBA — no PNG.  WebKit's toBlob does the
       GPU readback AND the PNG encode synchronously inside the call
       (research F2: ~40 % of the WebContent main thread), so the pipeline
       below never overlapped it.  The canvas is opaque, so getImageData's
       un-premultiplied bytes equal what the PNG round-trip decoded to.

    const _pfCapFrame = __pfFrame;

       draw overwrites it.  irOnly skips the pixel readback entirely. */
    const irSnap = state.captureIr ? GlyphGrid.textExport.snapFromIr(glyphFrame) : null;
    let blobReady;
    if (state.irOnly) {
      blobReady = Promise.resolve(null);
    } else if (state.rawFrames) {
      try {

      } catch (e) {

      }
    } else {

          if (_pfCapFrame) _pfCapFrame.stages.cap_toBlob_async = performance.now() - _tCap0;

    if (state.frameIdx >= state.total || state._inFlight >= CAPTURE_PIPELINE_DEPTH) {
      /* Backpressure (or nothing left to draw): pause until a frame settles. */

      return blobReady;
    }).then(function (blob) {

      const needsBase64 = !!state.framesB64;

      return encoded.then(function (base64) {

  function finishRecording(state) {

    const helpers = recordingHelpers(state);
    function complete(blob) {
      if (recState !== state || state.cancelled) return;
      /* BUG-009: recState used to survive past this point forever, so
         draw()'s `recState.done → noLoop()` froze the studio after every
         GUI export — dead canvas, dead status bar, and "Clear image"
         apparently broken (its handler ran, called loop(), draw() hit the
         stale done-state and noLoop()'d again before painting).  Batch
         mode dodged it because beginRecord installs a fresh recState per
         job.  Fix: onFinish consumes framesB64 SYNCHRONOUSLY (recordGIF /
         recordMP4 / batch all map frames before their async invoke), so
         clear the recording state and re-engage the loop right after it
         returns.  __statusHold keeps the encode/save feedback readable
         while frames render underneath; exportFeedback releases it. */
      if (onFinish) {
        onFinish(blob, helpers);
        recState = null;
        clearTimeout(window.__statusHoldTimer);
        window.__statusHold = true;
        try { loop(); } catch (e) {}
        /* The encode that follows can take 10–30 s — say what is
           actually happening (audit 2026-06-10). */
        statusEl().textContent =
          `RECORDED ${total} frames — encoding… (save dialog opens when done)`;
        return;
      }

      clearTimeout(window.__statusHoldTimer);
      window.__statusHold = true;

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const stamp = new Date().toISOString().replace(/[:.]/g, '-');
      a.download = `glyph-grid_${CONFIG.scene}_${CONFIG.palette}_${stamp}.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

        `RECORDED ${total} frames → ZIP downloaded. Unzip + run export-gif.sh`;
      window.__statusHoldTimer = setTimeout(() => { window.__statusHold = false; }, 4000);

      lazyFallbackZip(state).then(complete).catch(function (error) { failRecording(state, error); });

     deterministic and seamless at the wrap.  Still sources see the same

    const want = CONFIG.grid.cols * CONFIG.grid.rows;
    if (!cellSignalEma || cellSignalEma.length !== want) cellSignalEma = new Float32Array(want);
    cellSignalEma.fill(0.5);

    _stabKey = '';          /* _ensureStabBuf re-allocates to -1 */
    const n = Math.max(1, total | 0);
    const t0 = performance.now();
    const passMs = [];
    __primeOnly = true;
    try {
      for (let i = 0; i < PRIME_FRAMES; i++) {
        recState.frameIdx = (((n - PRIME_FRAMES + i) % n) + n) % n;
        const tp = performance.now();
        redraw();
        passMs.push(+(performance.now() - tp).toFixed(1));
      }

      __primeOnly = false;
      recState.frameIdx = 0;
    }

    let sum = 0;
    for (let i = 0; i < cellSignalEma.length; i++) sum += cellSignalEma[i];

    if (__pfFrame && __pfFrame.stages) {

    }

      frames: PRIME_FRAMES,
      ms: Math.round(performance.now() - t0),
      emaMean: +(sum / cellSignalEma.length).toFixed(4),

  let __lastPrime = null;

  /* ITER-074: the bundled Cascadia subset (ASCII, blocks, braille,

     Fetched once from the app bundle; null when unreachable (file:// preview)
     — the HTML then falls back to the viewer's monospace. */

  function loadInlineFontBase64() {
    if (!__inlineFontPromise) {

        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
        .then(function (buf) { return bytesToBase64(new Uint8Array(buf)); })
        .catch(function (e) { console.warn('inline font unavailable:', e); return null; });
    }

  }

  function formatFromPath(path) {
    const m = /\.([a-z0-9]+)$/i.exec(path || '');
    const ext = m ? m[1].toLowerCase() : '';
    if (ext === 'mp4') return 'mp4';
    if (ext === 'txt') return 'txt';
    if (ext === 'ans' || ext === 'ansi') return 'ansi';
    if (ext === 'cast') return 'cast';
    if (ext === 'html' || ext === 'htm') return 'html';

  }

  /* =================================================================
     Test hooks. getConfig now returns a deep clone (EC-4).
     ================================================================= */
  window.__glyphGridTest = {
    beginRecord(totalOrOpts, onFinishOverride) {
      const opts = (typeof totalOrOpts === 'object' && totalOrOpts !== null)
        ? totalOrOpts

                    border: jobBorder,

                const _pp = window.__preprocessPath || 'js';
                console.log('batch:', (idx + 1) + '/' + total, job.name, '→', p, 'preprocess:' + _pp);
                tauri('cli_log', { msg: 'batch: ' + (idx + 1) + '/' + total + ' ' + job.name + ' → ' + p + ' preprocess:' + _pp }).catch(()=>{});
                /* Emit PERF_JOB NDJSON when in perf mode — orchestrator
                   parses this from the studio's stderr. */
                if (perfMode) {
                  try {
                    const snap = snapshotPerf(job.name, requestedFrames, anchorFrames);
                    if (snap) {
                      snap.encode_ms = _encMs;
                      snap.preprocess = _pp;
                      tauri('cli_log', { msg: 'PERF_JOB ' + JSON.stringify(snap) }).catch(()=>{});
                    }
                  } catch (e) {
                    tauri('cli_log', { msg: 'PERF_JOB_ERR ' + job.name + ' ' + String(e) }).catch(()=>{});
                  }
                }
                CONFIG.animation.fps = savedFps;     // restore on success
                idx++;
                setTimeout(next, 50);
              })
              .catch(e => {
                cancelStaged();
                console.warn('batch: save failed', job.name, e);
                tauri('cli_log', { msg: 'batch: save failed ' + job.name + ' fmt=' + fmt + ' err=' + String(e) }).catch(()=>{});
                errors.push({ name: job.name, err: String(e) });
                CONFIG.animation.fps = savedFps;     // restore on encoder failure
                idx++;
                setTimeout(next, 50);
              });
              }
            });
            /* ITER-046: one line per job so a blank capture is diagnosable
               from the CLI log (emaMean ≈ 0 ⇒ signal came from an unpainted
               source) and the priming cost is on record. */
            if (__lastPrime) {
              Promise.resolve(tauri('cli_log', {
                msg: 'prime: ' + job.name + ' ' + JSON.stringify(__lastPrime),
              })).catch(()=>{});
            }
          } catch (error) {
            cancelStaged();
            advanceCaptureFailure(error, error && error.capture, 'capture-start');
          }
        }

        /* ITER-047: no settle timer.  stagedReady never rejects (errors land
           in stagedError and startCapture reports them); __assetsReady covers
           a glyph-set atlas this job's config may have just switched to.
           Pre-capture live draws cannot affect output any more (ITER-046). */
        stagedReady.then(__assetsReady).then(startCapture);
      }  // _runJob
      }  // next
      next();
    },
  };

  /* ===========================================================================
     CLI / headless render auto-hook.

     When this binary was launched as `glyph-grid-studio render --in foo --out
     bar`, the Rust side stored a HeadlessRenderJob in managed state.  We poll
     for it on startup; if present, auto-load the image, apply the config, run
     a single-job batch, and signal exit.  In GUI mode the call returns null
     and we do nothing.
     =========================================================================== */
  /* CLI/batch source loader — shared by tryHeadlessRender (initial load)
     and runBatchExport (per-job source swap when manifest jobs have
     heterogeneous `in` fields). Awaits decode + fit (ITER-047 dropped
     the settle sleep) so the caller can apply config and begin recording. */
  let __cliCurrentSource = null;
  async function _cliLoadSource(inPath) {
    const importGeneration = beginSourceImport(inPath);
    const core = window.__TAURI__.core;
    /* ITER-064 (F18): probe the file headers first so an over-limit
       animation/still is rejected before p5 allocates any frame. */
    const probe = await core.invoke('probe_image_file', { path: inPath });
    const sourceBytes = (probe && probe.sizeBytes) || 0;
    if (probe && probe.probed) {
      const checked = validateSourceMetadata({
        width: probe.width, height: probe.height,
        numFrames: function () { return probe.frames; },
      }, { sizeBytes: sourceBytes });
      if (!checked.ok) {
        window.__glyphLastImportError = checked;
        throw new Error('source rejected before decode: ' + checked.reason);
      }
    }
    /* The webview streams the file from disk via the asset protocol (no
       base64 data URL across IPC).  Fallback: inline data URL. */
    let sourceUrl = '';
    if (typeof core.convertFileSrc === 'function') {
      sourceUrl = core.convertFileSrc(inPath);
    } else {
      const loaded = await core.invoke('read_image_file', { path: inPath, inline: true });
      sourceUrl = (loaded && typeof loaded === 'object') ? (loaded.dataUrl || loaded.data_url) : loaded;
    }
    if (!sourceUrl) throw new Error('read_image_file returned no image data');
    await new Promise(function (resolve, reject) {
      window.loadImage(sourceUrl, function (img) {
        const accepted = acceptSourceImage(img, {
          generation: importGeneration,
          sizeBytes: sourceBytes,
        });
        if (accepted) resolve();
        else reject(new Error((window.__glyphLastImportError && window.__glyphLastImportError.reason)
          || 'source load was superseded'));
      }, function (err) {
        reject(err);
      });
    });
    __cliCurrentSource = inPath;
    /* ITER-047: no settle sleep — acceptSourceImage already fitted the canvas
       and painted once, and beginRecord primes the temporal state itself
       (ITER-046), so pre-capture live draws no longer influence output. */
  }

  /* ITER-069: headless output must stay a pure function of (source, config,
     seed). The WebGL2 preprocess (ITER-066) is driver-dependent, so headless
     runs (CLI render/batch, MCP — which spawns `render` — and window.PIPELINE
     pieces) default to the JS preprocess; a preset or manifest job opts back
     in with an explicit studio.gpuPreprocess:true, applied on top of this.
     The GUI keeps CONFIG's GL default for interactive speed. */
  function __headlessPreprocessDefault() {
    if (CONFIG.studio) CONFIG.studio.gpuPreprocess = false;
  }

  async function tryHeadlessRender() {
    if (!(window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke)) {
      // Not running in Tauri at all (browser preview): nothing to do.
      return;
    }
    let job;
    try {
      job = await window.__TAURI__.core.invoke('get_cli_render_job');
    } catch (e) {
      // Command not registered → not running in Tauri-with-CLI.  Silent.
      return;
    }
    if (!job) {
      console.log('CLI: GUI mode (no headless job)');
      return;
    }
    console.log('CLI: render job received', job);
    __headlessPreprocessDefault();

    // Pick the initial source — top-level `inPath`, or first job's `in`
    // (multi-source manifests may omit the top-level field).
    let initialSource = job.inPath;
    if (!initialSource && job.batch && Array.isArray(job.jobs) && job.jobs.length) {
      initialSource = job.jobs[0].inPath || null;
    }
    if (!initialSource) {
      console.error('CLI: no source path in manifest');
      try { await window.__TAURI__.core.invoke('exit_with_status', { ok: false }); } catch (_) {}
      return;
    }

    /* ITER-047: readiness instead of the 1500 ms start-up sleep — p5 setup()
       done (canvas, buffers, loadImage bound) and the font cascade settled.
       ITER-049: a setup() throw rejects __setupReady — exit non-zero rather
       than leave the CLI waiting for a render that can never start. */
    try {
      await __setupReady;
    } catch (e) {
      console.error('CLI: p5 setup failed:', e);
      try { await window.__TAURI__.core.invoke('cli_log', { msg: 'setup failed: ' + ((e && e.message) || e) }); } catch (_) {}
      try { await window.__TAURI__.core.invoke('exit_with_status', { ok: false }); } catch (_) {}
      return;
    }
    await __assetsReady();

    try {
      await _cliLoadSource(initialSource);
    } catch (e) {
      console.error('CLI: initial loadImage failed:', e);
      try { await window.__TAURI__.core.invoke('cli_log', { msg: 'source load failed: ' + ((e && e.message) || e) }); } catch (_) {}
      try { await window.__TAURI__.core.invoke('exit_with_status', { ok: false }); } catch (_) {}
      return;
    }


    /* Batch mode (ITER-024 + multi-source extension): the Rust side may
       pass `batch:true` with a jobs array.  Each job may carry its own
       `inPath` (multi-source manifests — used by the autonomous
       optimization loop's 4-source × 5-config bench).  When a job's
       inPath differs from the currently-loaded source, runBatchExport
       async-swaps the source via _cliLoadSource before the render. */
    if (job.batch && Array.isArray(job.jobs)) {
      var batchJobs = job.jobs.map(function (j) {
        return {
          name:           j.name || 'job',
          path:           j.outPath,
          inPath:         j.inPath || null,
          frames:         j.frames || job.frames || 24,   // ITER-057: per-job, number or 'auto'
          border:         j.border || null,
          format:         j.format,
          config:         j.config || {},
          capWidth:       (j.capWidth && j.capWidth > 0) ? j.capWidth : 0,
          targetMaxBytes: (j.targetMaxBytes && j.targetMaxBytes > 0) ? j.targetMaxBytes : null,
          mp4Quality:     j.mp4Quality || null,
        };
      });
      console.log('CLI: batch mode — ' + batchJobs.length + ' jobs queued' + (job.perf ? ' (perf:on)' : ''));
      __glyphGridTest.runBatchExport(batchJobs, {
        perf: !!job.perf,
        onComplete: function (result) {
          var ok = result && result.errors && result.errors.length === 0;
          var summary = 'batch complete: ' + (result.ok || 0) + '/' + batchJobs.length + ' ok';
          if (result.errors && result.errors.length) {
            summary += ', ' + result.errors.length + ' errors: ' +
              result.errors.map(function (e) { return e.name + '(' + e.err + ')'; }).join(', ');
          }
          console.log('CLI: ' + summary);
          window.__TAURI__.core.invoke('cli_log', { msg: summary }).catch(function () {});
          window.__TAURI__.core.invoke('exit_with_status', { ok: !!ok });
        },
      });
      return;
    }

    // Apply the CLI-supplied config (camelCase, JS-shape — built by Rust).
    if (job.config && typeof job.config === 'object') {
      try {
        __glyphGridTest.setConfig(job.config);
      } catch (e) {
        console.error('CLI: setConfig failed:', e);
      }
    }

    // ITER-047: the config may name a glyph set whose atlas is still being
    // pre-warmed — wait for the asset, not for the clock.
    await __assetsReady();

    // Run a single-job batch export to the requested output path.
    __glyphGridTest.runBatchExport([{
      name: 'cli',
      path: job.outPath,
      frames: job.frames || 24,   // number, or 'auto' (resolved per job, ITER-057)
      format: job.format,  // 'gif' (default) | 'mp4' — Rust pre-resolves
      mp4Quality: job.mp4Quality || null,  // --mp4-quality (ITER-050)
      config: {},  // already applied above
    }], {
      onComplete: function (result) {
        var ok = result && result.errors && result.errors.length === 0 && result.ok === 1;
        console.log('CLI: render complete; exiting with ok=' + ok);
        window.__TAURI__.core.invoke('exit_with_status', { ok: !!ok });
      },
    });
  }

  // tryHeadlessRender awaits __setupReady / __assetsReady itself (ITER-047),
  // so it can start as soon as the document is parsed.
  window.addEventListener('DOMContentLoaded', function () {
    tryHeadlessRender();
  });
  </script>
</body>
</html>
